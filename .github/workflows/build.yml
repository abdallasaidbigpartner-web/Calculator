name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools
      - name: Build APK
        shell: bash
        run: |
          java -version
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -n -i -E "error|failed|exception" build.log | tail -n 25 || true
          echo "-------- LAST LINES --------"
          tail -n 30 build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
